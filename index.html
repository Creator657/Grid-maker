<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16x16 Image Grid Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>16x16 Image Grid</h1>
        <p>Click any slot to upload, or drag & drop an image file directly onto a box.</p>
        
        <!-- The 256-box grid will generate inside here -->
        <div id="image-grid" class="grid-16x16"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
